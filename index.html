<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>شات النسر</title><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><div class="brand"><span class="brand-mark">🦅</span> شات النسر</div>
<div class="top-actions"><button id="themeBtn">☾</button><button id="usersBtn">👥 <b id="onlineCount">0</b></button></div></header>
<main class="layout">
<aside class="sidebar" id="sidebar"><div class="profile-card"><div class="avatar big">ن</div><div><strong id="myName">زائر</strong><small>متصل الآن</small></div><button id="editName">✎</button></div>
<div class="section-title">الغرف</div>
<button class="room active" data-room="العام">💬 <span>العام</span></button>
<button class="room" data-room="اليمن">🇾🇪 <span>اليمن</span></button>
<button class="room" data-room="سوالف">🎵 <span>سوالف</span></button>
<button class="room" data-room="تعارف">❤️ <span>تعارف</span></button></aside>
<section class="chat"><div class="chat-head"><div><h1 id="roomTitle">العام</h1><span><i class="dot"></i> دردشة مباشرة</span></div><button id="toggleSidebar">☰</button></div>
<div id="messages" class="messages"></div><div class="typing"></div>
<form id="composer" class="composer"><button type="button" id="emojiBtn">😊</button><input id="messageInput" placeholder="اكتب رسالتك هنا..." autocomplete="off"><button class="send">إرسال</button></form></section>
<aside class="right-panel"><div class="panel-title">المتواجدون الآن</div><div id="rightUsers"></div></aside>
</main>
<div class="modal hidden" id="nameModal"><div class="modal-card"><h2>اختر اسمك</h2><p>سيظهر الاسم داخل الغرف والرسائل.</p><input id="nameInput" maxlength="24" placeholder="اسم المستخدم"><button id="saveName">دخول</button></div></div>
<script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
