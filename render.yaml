services:
  - type: web
    name: chat-elnsr
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/chat.sqlite
    # For persistent SQLite data on Render, attach a persistent disk
    # at /data in the Render Dashboard. Persistent disks are available
    # on paid web services.
